name: Teclado Remoto

on:
  push:
    paths:
      - "teclado-remoto/**"
      - ".github/workflows/teclado-remoto.yml"
  pull_request:
    paths:
      - "teclado-remoto/**"
      - ".github/workflows/teclado-remoto.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teclado-remoto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: PC (Windows .exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: teclado-remoto/pc-windows
    steps:
      - uses: actions/checkout@v5

      - name: Rust estável
        run: rustup update stable --no-self-update && rustup default stable

      - name: Testes
        run: cargo test --locked

      - name: Compilar
        run: |
          cargo build --release --locked
          Copy-Item target/release/teclado-remoto.exe TecladoRemoto.exe

      - name: Conferir que roda sem o Visual C++ Redistributable
        run: |
          if (Select-String -Path TecladoRemoto.exe -Pattern 'vcruntime140' -SimpleMatch -Quiet) {
            throw "O .exe depende do vcruntime140.dll (o runtime C deveria estar embutido)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TecladoRemoto-Windows
          path: teclado-remoto/pc-windows/TecladoRemoto.exe
          if-no-files-found: error

  android:
    name: Celular (Android .apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teclado-remoto/android
    env:
      KEYSTORE_BASE64: ${{ secrets.TRK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Chave de assinatura própria (opcional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "TRK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "TRK_KEYSTORE_PASSWORD=${{ secrets.TRK_KEYSTORE_PASSWORD }}"
            echo "TRK_KEY_ALIAS=${{ secrets.TRK_KEY_ALIAS }}"
            echo "TRK_KEY_PASSWORD=${{ secrets.TRK_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Testes, lint e APK
        run: ./gradlew :core:test :app:lintRelease :app:assembleRelease

      - name: Teste ponta a ponta (app ↔ servidor do PC)
        working-directory: teclado-remoto
        run: tools/e2e.sh

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk TecladoRemoto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TecladoRemoto-Android
          path: teclado-remoto/android/TecladoRemoto.apk
          if-no-files-found: error

  release:
    name: Publicar versão
    if: startsWith(github.ref, 'refs/tags/teclado-remoto-v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" TecladoRemoto.exe TecladoRemoto.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Teclado Remoto ${GITHUB_REF_NAME#teclado-remoto-}" \
            --notes "Instale o TecladoRemoto.apk no celular e rode o TecladoRemoto.exe no PC. Veja teclado-remoto/README.md."
